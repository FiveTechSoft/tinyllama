<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- coi-serviceworker: inyecta COOP/COEP para habilitar SharedArrayBuffer
     (pthreads WASM) en GitHub Pages. Recarga la pagina una vez la 1ra vez. -->
<script src="coi-serviceworker.js"></script>
<title>tinillama — chat con TinyLlama-1.1B en tu navegador</title>
<style>
  :root { color-scheme: dark; }
  body { font-family: system-ui, sans-serif; max-width: 760px; margin: 1.5rem auto; padding: 0 1rem; background: #0d1117; color: #e6edf3; display: flex; flex-direction: column; min-height: 95vh; }
  h1 { font-size: 1.3rem; margin-bottom: .2rem; }
  .sub { color: #8b949e; font-size: .85rem; margin-bottom: 1rem; }
  #bar { width: 100%; height: 8px; background: #21262d; border-radius: 4px; overflow: hidden; margin: .5rem 0; }
  #bar > div { height: 100%; width: 0%; background: #2f81f7; transition: width .2s; }
  #status { font-size: .8rem; color: #8b949e; min-height: 1.1em; margin-bottom: .5rem; }
  #chat { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: .6rem; padding: .5rem 0; }
  .msg { padding: .6rem .8rem; border-radius: 10px; white-space: pre-wrap; line-height: 1.45; max-width: 92%; }
  .user { align-self: flex-end; background: #1f6feb; }
  .bot { align-self: flex-start; background: #161b22; border: 1px solid #30363d; }
  .bot .meta { display: block; margin-top: .4rem; font-size: .72rem; color: #8b949e; }
  #composer { display: flex; gap: .5rem; margin-top: .8rem; }
  #input { flex: 1; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 8px; padding: .6rem; font: inherit; resize: none; }
  button { background: #238636; color: #fff; border: 0; border-radius: 8px; padding: .55rem 1rem; font: inherit; cursor: pointer; }
  button:disabled { background: #21262d; color: #8b949e; cursor: default; }
  #new { background: #21262d; }
  .opts { display: flex; gap: .8rem; align-items: center; font-size: .78rem; color: #8b949e; flex-wrap: wrap; }
  .opts input { width: 3.6rem; background: #161b22; color: #e6edf3; border: 1px solid #30363d; border-radius: 6px; padding: .25rem; }
  #modelPicker { display: flex; gap: 1.2rem; align-items: center; font-size: .82rem; margin-bottom: .6rem; }
  #modelPicker label { display: flex; gap: .4rem; align-items: center; cursor: pointer; }
  #loadBtn { background: #8957e5; }
  #metrics { border: 1px solid #30363d; border-radius: 8px; padding: .5rem .8rem; margin-bottom: .6rem; background: #0a0d13; }
  #metricsLine { margin: 0; }
  #metricsLine b { color: #3fb950; }
  #history { border: 1px solid #30363d; border-radius: 8px; padding: .5rem .8rem; margin-bottom: .6rem; background: #0a0d13; display: none; }
  #histTable { width: 100%; font-size: .74rem; border-collapse: collapse; margin-top: .4rem; }
  #histTable th { text-align: left; color: #8b949e; font-weight: 500; border-bottom: 1px solid #30363d; padding: .2rem .4rem; }
  #histTable td { padding: .2rem .4rem; border-bottom: 1px solid #21262d; font-variant-numeric: tabular-nums; }
  #histToggle { background: #21262d; font-size: .75rem; padding: .3rem .7rem; margin-bottom: .6rem; }
  #liveLoss b { color: #d29922; }
</style>
</head>
<body>
<h1>tinillama chat</h1>
<p class="sub">Dos motores C → WASM corriendo <b>en tu navegador</b>, sin servidor.</p>

<div id="modelPicker">
  <label><input type="radio" name="m" value="adaptive" checked> Adaptativo (2 MB, instantáneo, se entrena solo 4×/día)</label>
  <label><input type="radio" name="m" value="big"> TinyLlama-1.1B (608 MB, 1º load lento)</label>
  <button id="loadBtn">Cargar modelo</button>
</div>

<div id="metrics" style="display:none">
  <div id="metricsLine" class="sub"></div>
</div>

<button id="histToggle" style="display:none" onclick="document.getElementById('history').style.display = document.getElementById('history').style.display==='none' ? 'block' : 'none'">📈 Evolución del modelo</button>
<div id="history"></div>

<div id="bar"><div></div></div>
<div id="status">Elige un modelo y pulsa Cargar…</div>

<div id="chat"></div>

<div class="opts">
  <label>maxTokens <input id="maxTokens" type="number" value="200"></label>
  <label>temp <input id="temp" type="number" value="0.7" step="0.1" min="0" max="2"></label>
  <label>topK <input id="topK" type="number" value="40"></label>
  <button id="new">Nueva conversación</button>
  <button id="trainBtn" style="background:#8957e5">🎓 Entrenar en vivo</button>
  <button id="contribBtn" style="display:none;background:#d29922">⭐ Contribuir mejora</button>
</div>
<div id="liveTrain" style="display:none;border:1px solid #30363d;border-radius:8px;padding:.5rem .8rem;margin-top:.5rem;background:#0a0d13">
  <div id="liveLoss" class="sub">Loss: — · PPL: — · steps: 0</div>
  <div id="liveBar" style="width:100%;height:6px;background:#21262d;border-radius:3px;overflow:hidden"><div style="height:100%;width:0%;background:#d29922"></div></div>
  <canvas id="lossChart" width="340" height="60" style="margin-top:.4rem"></canvas>
</div>
<div id="composer">
  <textarea id="input" rows="2" placeholder="Escribe tu mensaje… (Enter para enviar)" disabled></textarea>
  <button id="send" disabled>Enviar</button>
</div>

<script>
  // captura errores JS/async y los muestra en la barra de estado
  window.addEventListener('error', (e) => {
    const s = document.getElementById('status');
    if (s) s.textContent = 'Error JS: ' + e.message;
  });
  window.addEventListener('unhandledrejection', (e) => {
    const s = document.getElementById('status');
    if (s) s.textContent = 'Error async: ' + ((e.reason && e.reason.message) || e.reason);
  });
</script>
<script type="module">
  import { TinyLlama } from './tinyllama.js';
  import { Adaptive } from './adaptive.js';

  const $ = (id) => document.getElementById(id);
  const bar = document.querySelector('#bar > div');
  let llm = null, busy = false;
  const history = []; // [{u, a}]

  const addMsg = (cls, text) => {
    const d = document.createElement('div');
    d.className = 'msg ' + cls;
    d.textContent = text;
    $('chat').appendChild(d);
    d.scrollIntoView({ behavior: 'smooth', block: 'end' });
    return d;
  };

  /* ---------- carga con selector de modelo ---------- */
  async function loadSelected() {
    const which = document.querySelector('input[name=m]:checked').value;
    llm = null;
    bar.style.width = '0%';
    try {
      if (which === 'adaptive') {
        llm = await Adaptive.load({
          onProgress: (f) => { bar.style.width = '100%'; },
          onMetadata: (md) => {
            $('metrics').style.display = 'block';
            $('metricsLine').innerHTML =
              `<b>${md.mp}M pesos</b> · dim=${md.dim} · L=${md.layers} · H=${md.heads} · hid=${md.hidden}` +
              ` · ctx=${md.seq} · <b>${md.steps} pasos de entrenamiento</b> · ${md.sizeMB} MB` +
              (md.lastPpl ? ` · PPL ${md.lastPplBefore}→${md.lastPplAfter}` : '');
            /* historico de evolucion: metrics.csv publicado por el trainer */
            import('./history.js').then(async ({ fetchHistory, renderHistory }) => {
              try {
                const rows = await fetchHistory();
                if (rows.length) {
                  $('history').innerHTML = renderHistory(rows);
                  $('history').style.display = 'block';
                  $('histToggle').style.display = 'inline-block';
                }
              } catch (e) { console.warn('historico no disponible:', e.message); }
            });
          },
        });
      } else {
        $('metrics').style.display = 'none';
        llm = await TinyLlama.load({
          onProgress: (f) => {
            bar.style.width = (f * 100).toFixed(1) + '%';
            $('status').textContent = `Descargando… ${(f * 100).toFixed(0)}%`;
          },
        });
      }
      $('status').textContent = 'Modelo cargado. ¡Chatea!';
      $('input').disabled = false;
      $('send').disabled = false;
      $('input').focus();
    } catch (e) {
      $('status').textContent = 'Error: ' + e.message;
    }
  }
  $('loadBtn').onclick = loadSelected;

  // Formato Zephyr (TinyLlama-Chat) como texto literal: este GGUF no trae
  // los tokens especiales, pero el modelo responde bien al formato.
  const buildPrompt = (msg) => {
    let p = '';
    for (const t of history) p += `<|user|>\n${t.u}</s>\n<|assistant|>\n${t.a}</s>\n`;
    return p + `<|user|>\n${msg}</s>\n<|assistant|>\n`;
  };

  const send = async () => {
    const msg = $('input').value.trim();
    if (!msg || !llm || busy) return;
    busy = true;
    $('send').disabled = true;
    $('send').textContent = 'Generando…';
    $('input').disabled = true;
    $('input').value = '';
    addMsg('user', msg);
    const bubble = addMsg('bot', '…');
    const t0 = performance.now();
    let n = 0, text = '';
    try {
      $('status').textContent = 'Procesando prompt (prefill)…';
      const gen = llm.generate(buildPrompt(msg), {
        maxTokens: +$('maxTokens').value,
        temp: +$('temp').value,
        topK: +$('topK').value,
      });
      for await (const chunk of gen) {
        if (typeof chunk !== 'string') { // prefillDone
          $('status').textContent = `Prefill ${chunk.prefillSeconds.toFixed(1)}s — generando…`;
          continue;
        }
        text += chunk;
        if (text.includes('</s>')) { text = text.split('</s>')[0]; break; }
        n++;
        bubble.textContent = text;
        const dt = (performance.now() - t0) / 1000;
        $('status').textContent = `${n} tokens — ${(n / dt).toFixed(2)} tok/s`;
      }
      bubble.textContent = text || '(sin respuesta)';
      const dt = (performance.now() - t0) / 1000;
      const meta = document.createElement('span');
      meta.className = 'meta';
      meta.textContent = `${n} tokens · ${(n / dt).toFixed(2)} tok/s · ${dt.toFixed(0)}s`;
      bubble.appendChild(meta);
      history.push({ u: msg, a: text });
      $('status').textContent = 'Listo.';
    } catch (e) {
      bubble.textContent = 'Error: ' + e.message;
    }
    busy = false;
    $('send').disabled = false;
    $('send').textContent = 'Enviar';
    $('input').disabled = false;
    $('input').focus();
  };

  $('send').onclick = send;
  $('input').onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } };
  $('new').onclick = () => { history.length = 0; $('chat').innerHTML = ''; };

  /* ============ entrenamiento EN VIVO (didactico, loss real) ============ */
  const live = { on: false, losses: [], ppl0: 0, model: 'adaptive' };

  $('trainBtn').onclick = async () => {
    if (live.on || !llm) return;
    live.on = true;
    $('trainBtn').disabled = true;
    $('liveTrain').style.display = 'block';
    $('contribBtn').style.display = 'none';
    $('status').textContent = 'Preparando entrenamiento en vivo…';
    const which = document.querySelector('input[name=m]:checked').value;
    live.model = which;

    /* corpus: conversaciones de esta sesion + semilla del site */
    const seeded = 'hola que tal~buenos dias~como estas~el cielo es azul~me gusta el cafe~la vida es bella~aprender cada dia~gracias por tu ayuda';
    const turns = history.map(t => `\x01${t.u}\x02${t.a}\x03\n`).join('') +
      seeded.split('~').map(s => `\x01${s}\x02${s}\x03\n`).join('');
    llm.postMessage({ cmd: 'live_start', corpus: turns || seeded, ctx: 64 });

    /* 30 chunks x 20 steps; evalua PPL cada chunk; dibuja curva */
    const losses = [];
    let chunk = 0;
    const CH = 30, STEPS = 40, BATCH = 4;
    for (let c = 0; c < CH && live.on; c++) {
      llm.postMessage({ cmd: 'live_chunk', steps: STEPS, batch: BATCH, lr: 3e-4 });
      const prog = await new Promise((res) => {
        llm.#worker_save = null;
        const h = (ev) => {
          if (ev.data.type === 'liveProgress') { llm.removeEventListener('message', h); res(ev.data); }
        };
        llm.addEventListener('message', h);
      });
      losses.push(prog.loss);
      const pplNow = typeof prog.ppl === 'number' ? prog.ppl : 0;
      if (c === 0) live.ppl0 = pplNow;
      $('liveLoss').innerHTML =
        `Loss: <b>${prog.loss.toFixed(4)}</b> · PPL: <b>${pplNow.toFixed(1)}</b> · steps: ${prog.steps}`;
      $('liveBar').firstChild.style.width = ((c + 1) / CH * 100).toFixed(0) + '%';
      drawLoss(losses);
      if (c === CH - 1) $('contribBtn').style.display = 'inline-block';
    }
    $('trainBtn').disabled = false;
    live.on = false;
  };

  const drawLoss = (vals) => {
    const cv = document.getElementById('lossChart');
    const ctx = cv.getContext('2d');
    ctx.clearRect(0, 0, cv.width, cv.height);
    if (vals.length < 2) return;
    const mx = Math.max(...vals), mn = Math.min(...vals);
    const sp = mx - mn || 1;
    ctx.strokeStyle = '#d29922';
    ctx.lineWidth = 2;
    ctx.beginPath();
    vals.forEach((v, i) => {
      const x = (cv.width - 4) * (i / (vals.length - 1)) + 2;
      const y = 4 + (cv.height - 8) * (1 - (v - mn) / sp);
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    });
    ctx.stroke();
  };

  /* ===== contribucion DIRECTA: PR automatica con los pesos entrenados ===== */
  $('contribBtn').onclick = async () => {
    const token = prompt(
      'Token de GitHub (minimo public_repo). Solo vive en tu navegador:\n' +
      'https://github.com/settings/tokens/new?scopes=public_repo');
    if (!token) return;
    $('contribBtn').disabled = true;
    $('status').textContent = 'Exportando pesos entrenados…';
    /* 1. pedir los pesos al worker */
    const ev = await new Promise((res) => {
      const h = (e) => {
        if (e.data.type === 'liveSaved') { llm.removeEventListener('message', h); res(e.data); }
      };
      llm.addEventListener('message', h);
      llm.postMessage({ cmd: 'live_save', max: 4194304 });
    });
    const bytes = new Uint8Array(ev.bytes);
    let b64 = '';
    for (let i = 0; i < bytes.length; i += 0x8000)
      b64 += btoa(String.fromCharCode(...bytes.subarray(i, i + 0x8000)));
    const ts = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
    const branch = 'contrib/lives-' + ts;
    const path = 'adaptive/contrib/lives-' + ts + '.adm';
    const H = {
      'Authorization': 'Bearer ' + token,
      'Accept': 'application/vnd.github+json',
    };
    try {
      /* 2. branch desde main */
      const refRes = await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/refs/heads/main');
      const ref = await refRes.json();
      await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/refs', {
        method: 'POST', headers: H,
        body: JSON.stringify({ ref: 'refs/heads/' + branch, sha: ref.object.sha }),
      });
      /* 3. blob */
      const blobRes = await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/blobs', {
        method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: b64, encoding: 'base64' }),
      });
      const blob = await blobRes.json();
      /* 4. commit */
      const treeRes = await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/trees', {
        method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          base_tree: ref.object.sha,
          tree: [{ path: path, mode: '100644', type: 'blob', sha: blob.sha }],
        }),
      });
      const tree = await treeRes.json();
      const cmRes = await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/commits', {
        method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          message: 'contrib: pesos entrenados en navegador ' + ts,
          tree: tree.sha, parents: [ref.object.sha],
        }),
      });
      const cm = await cmRes.json();
      await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/git/refs/heads/' + branch, {
        method: 'PATCH', headers: H, body: JSON.stringify({ sha: cm.sha }),
      });
      /* 5. PR */
      const prRes = await fetch('https://api.github.com/repos/FiveTechSoft/tinyllama/pulls', {
        method: 'POST', headers: { ...H, 'Content-Type': 'application/json' },
        body: JSON.stringify({
          title: 'contrib: entrenamiento en vivo ' + ts,
          head: branch, base: 'main',
          body: 'Pesos entrenados en la web (loss en vivo) listos para el gate de PPL.',
        }),
      });
      const pr = await prRes.json();
      $('status').textContent = 'PR creada: ' + (pr.html_url || pr.message);
      if (pr.html_url) window.open(pr.html_url, '_blank');
    } catch (e) {
      $('status').textContent = 'ERROR contrib: ' + e.message;
    }
    $('contribBtn').disabled = false;
  };

  // carga automática del modelo por defecto (el adaptativo: rapidisimo)
  (async () => {
    await loadSelected();
    // #selftest: envia un mensaje corto automaticamente (diagnostico)
    if (location.hash === '#selftest') {
      $('maxTokens').value = 12;
      $('input').value = 'What is happiness?';
      send();
    }
  })();
</script>
</body>
</html>
