name: Build WASM & Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:3.1.61
    steps:
      - uses: actions/checkout@v4

      - name: Compile engine to WebAssembly (pthreads + SIMD128)
        run: |
          mkdir -p site
          emcc engine/tinyllama.c -O3 -msimd128 -DTL_WASM_THREADS \
            -o site/tinyllama-engine.js \
            -s WASM=1 \
            -s USE_PTHREADS=1 \
            -s 'PTHREAD_POOL_SIZE=navigator.hardwareConcurrency||4' \
            -s INITIAL_MEMORY=1610612736 \
            -s MODULARIZE=1 \
            -s EXPORT_ES6=1 \
            -s EXPORT_NAME=createTinyLlamaModule \
            -s ENVIRONMENT=web,worker \
            -s EXPORTED_FUNCTIONS=_tl_init,_tl_set_prompt,_tl_step,_tl_token_str,_tl_generated,_malloc,_free \
            -s EXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString
          ls -la site/

      - name: Compile adaptive engine to WebAssembly (single-thread, tiny)
        run: |
          emcc adaptive/ad_core.c -O3 -msimd128 \
            -o site/adaptive-engine.js \
            -s WASM=1 \
            -s ALLOW_MEMORY_GROWTH=1 \
            -s MODULARIZE=1 \
            -s EXPORT_ES6=1 \
            -s EXPORT_NAME=createAdaptiveModule \
            -s ENVIRONMENT=web,worker \
            -s EXPORTED_FUNCTIONS=_ad_load_mem,_ad_set_prompt_mem,_ad_step_mem,_ad_tok_str,_ad_stats,_malloc,_free \
            -s EXPORTED_RUNTIME_METHODS=ccall,cwrap,UTF8ToString,HEAPF32,HEAPU8
          ls -la site/adaptive-engine.js

      - name: Assemble site
        run: |
          cp web/index.html web/tinyllama.js web/adaptive.js web/history.js web/llm-worker.js web/coi-serviceworker.js site/
          cp web/adaptive-worker.js site/
          cp -r web/model site/model
          mkdir -p site/adaptive
          cp adaptive/model.adm site/adaptive/model.adm
          cp adaptive/metrics.csv site/adaptive/metrics.csv
          ls -la site site/model site/adaptive | head -30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
