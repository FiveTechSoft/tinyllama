name: Adaptive train

# Ciclo de mejora del modelo adaptativo: medir -> entrenar -> medir ->
# publicar solo si la PPL de validacion mejora. Varias veces al dia.
on:
  schedule:
    # 4 ciclos diarios (UTC): 01:23, 07:23, 13:23, 19:23
    - cron: "23 1 * * *"
    - cron: "23 7 * * *"
    - cron: "23 13 * * *"
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "pasos de entrenamiento"
        default: "2000"
      dim:
        description: "dim del modelo si crea fresh"
        default: "96"
      heads:
        description: "cabezas de atencion"
        default: "4"
      layers:
        description: "bloques del transformer"
        default: "4"

permissions:
  contents: write

concurrency:
  group: adaptive-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Instalar GCC
        run: sudo apt-get update && sudo apt-get install -y gcc

      - name: Compilar entrenador
        run: |
          cd adaptive
          gcc -O3 -mavx2 -o train train.c ad_core.c -lm
          gcc -O2 -o prep_data prep_data.c
          gcc -O2 -o ft_ingest ft_ingest.c

      - name: Dataset desde peng-mimo (clone shallow)
        run: |
          git clone --depth 1 --branch peng \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/FiveTechSoft/peng-mimo.git pm
          echo "jsonl disponibles en pm/dataset/verified:"
          ls pm/dataset/verified/ 2>/dev/null || echo "(ninguno aun)"

      - name: Cache corpus FineTome completo
        uses: actions/cache@v4
        with:
          path: adaptive/corpus_ft_big.bin
          key: finetome-100k-v1

      - name: Preparar corpus (peng-mimo hoy + FineTome-100k + historico)
        run: |
          cd adaptive
          # corpus nuevo: lo de hoy, normalizado a UTF-8
          cat ../pm/dataset/verified/prog-*.jsonl > batch.jsonl 2>/dev/null || true
          if [ -s batch.jsonl ]; then
            python3 -c "data = open('batch.jsonl','rb').read(); data = data.decode('utf-16').encode('utf-8') if data[:2] == b'\xff\xfe' else data; open('batch_u8.jsonl','wb').write(data); print('batch hoy:', len(data), 'bytes')"
            ./prep_data corpus_hoy.bin batch_u8.jsonl
          fi
          # FineTome-100k completo: descarga y convierte (cacheado, no commiteado)
          python3 -m pip install -q pyarrow || pip install -q pyarrow || true
          python3 ../../scripts/finetome_prep.py 2>/dev/null || python3 ../scripts/finetome_prep.py
          # mezcla: hoy + historico peng-mimo + FineTome rotante
          cat corpus_peng.bin corpus_ft_small.bin > corpus_total.bin
          [ -f corpus_hoy.bin ] && cat corpus_hoy.bin >> corpus_total.bin
          [ -f corpus_ft_rot.bin ] && cat corpus_ft_rot.bin >> corpus_total.bin
          echo "corpus_total: $(stat -c%s corpus_total.bin) bytes"; ls -la corpus_*.bin

      - name: Entrenar (gate de publicacion por PPL)
        run: |
          cd adaptive
          echo "corpus:"; ls -la corpus_*.bin
          # entrena 3 tandas incrementales; solo publica si mejora la PPL
          for ciclo in 1 2 3; do
            if [ -f model.adm ]; then
              ./train --model model.adm --data corpus_total.bin \
                --val corpus_total.bin --steps 1500 --batch 8 --ctx 96 \
                --eval 60 --out model.adm || true
            else
              ./train --fresh 96,4,4 --data corpus_total.bin \
                --val corpus_total.bin --steps 1500 --batch 8 --ctx 96 || true
            fi
          done
          cat metrics.csv 2>/dev/null | tail -5

      - name: Commit modelo + metricas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adaptive/model.adm adaptive/metrics.csv
          if git diff --cached --quiet; then
            echo "sin cambios que publicar"
          else
            git commit -m "adaptive: ciclo de entrenamiento automatico $(date -u +%Y-%m-%dT%H:%M)"
            git push
          fi

      - name: Re-deploy Pages con el modelo mejorado
        if: success()
        run: |
          # el deploy.yml corre on:push en main; el push del bot ya lo dispara.
          # fallback: dispatch manual por si main estaba a la par.
          gh workflow run deploy.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}