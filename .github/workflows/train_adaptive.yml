name: Adaptive train

# Ciclo de mejora del modelo adaptativo: medir -> entrenar -> medir ->
# publicar solo si la PPL de validacion mejora. Varias veces al dia.
on:
  schedule:
      # 8 ciclos/dia: cada 3h (dentro de los terminos de uso de Actions:
    # entrenamiento = desarrollo del proyecto, carga proporcional al beneficio)
    - cron: "18 0 * * *"
    - cron: "18 3 * * *"
    - cron: "18 6 * * *"
    - cron: "18 9 * * *"
    - cron: "18 12 * * *"
    - cron: "18 15 * * *"
    - cron: "18 18 * * *"
    - cron: "18 21 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "pasos de entrenamiento"
        default: "2000"

permissions:
  contents: write

concurrency:
  group: adaptive-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Compilar entrenador CPU (runner sin GPU)
        run: |
          cd adaptive
          gcc -O3 -mavx2 -o train train.c ad_core.c ad_muon.c -lm
          gcc -O2 -o prep_data prep_data.c
          gcc -O2 -o ft_ingest ft_ingest.c
          gcc -O2 -o cma cma.c ad_core.c

      - name: Entrenar (3 tandas CPU + CMA)
        run: |
          cd adaptive
          cp corpus_all_ids.bin corpus_cycle_ids.bin
          echo "corpus: $(stat -c%s corpus_cycle_ids.bin) bytes"
          PUNTO="model.adm"
          for ciclo in 1 2 3; do
            ./train --model "$PUNTO" --data corpus_cycle_ids.bin \
              --val corpus_cycle_ids.bin --steps 3000 --batch 8 --ctx 96 \
              --eval 60 --out "tanda${ciclo}.adm" --vocab 2048 || \
            ./train --fresh 192,6,6 --vocab 2048 --data corpus_cycle_ids.bin \
              --val corpus_cycle_ids.bin --steps 3000 --batch 8 --ctx 96 || true
            PUNTO="tanda${ciclo}.adm"
          done
          if [ -f tanda1.adm ] && [ -f tanda2.adm ] && [ -f tanda3.adm ]; then
            ./cma model_cma.adm tanda1.adm tanda2.adm tanda3.adm || true
            cp model_cma.adm model.adm 2>/dev/null || true
          else
            [ -f tanda3.adm ] && cp tanda3.adm model.adm || true
          fi
          cat metrics.csv 2>/dev/null | tail -5

      - name: Commit modelo + metricas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adaptive/model.adm adaptive/metrics.csv
          if git diff --cached --quiet; then
            echo "sin cambios que publicar"
          else
            git commit -m "adaptive: ciclo de entrenamiento automatico $(date -u +%Y-%m-%dT%H:%M)"
            git pull --rebase origin main || git rebase --abort || true
            git push || (git pull --rebase origin main && git push)
          fi

