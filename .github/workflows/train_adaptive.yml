name: Adaptive train

# Ciclo de mejora del modelo adaptativo: medir -> entrenar -> medir ->
# publicar solo si la PPL de validacion mejora. Varias veces al dia.
on:
  schedule:
      # 8 ciclos/dia: cada 3h (dentro de los terminos de uso de Actions:
    # entrenamiento = desarrollo del proyecto, carga proporcional al beneficio)
    - cron: "18 0 * * *"
    - cron: "18 3 * * *"
    - cron: "18 6 * * *"
    - cron: "18 9 * * *"
    - cron: "18 12 * * *"
    - cron: "18 15 * * *"
    - cron: "18 18 * * *"
    - cron: "18 21 * * *"
  workflow_dispatch:
    inputs:
      steps:
        description: "pasos de entrenamiento"
        default: "2000"
      dim:
        description: "dim del modelo si crea fresh"
        default: "96"
      heads:
        description: "cabezas de atencion"
        default: "4"
      layers:
        description: "bloques del transformer"
        default: "4"

permissions:
  contents: write

concurrency:
  group: adaptive-train
  cancel-in-progress: false

jobs:
  train:
    runs-on: [self-hosted, gpu]
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Compilar entrenador (GPU)
        run: |
          cd adaptive
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 -DUSE_GPU -c train.c -o train.o
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 -DUSE_GPU -c ad_gpu.cu -o ad_gpu.o
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 -c ad_core.c -o ad_core.o
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 -c ad_muon.c -o ad_muon.o
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 train.o ad_core.o ad_muon.o ad_gpu.o -lcublas -lm -o train_gpu
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 -c cma.c -o cma.o
          /usr/local/cuda/bin/nvcc -O3 -arch=sm_86 cma.o ad_core.o -lm -o cma
          gcc -O2 -o prep_data prep_data.c
          gcc -O2 -o ft_ingest ft_ingest.c

      - name: Dataset desde peng-mimo (clone shallow)
        run: |
          git clone --depth 1 --branch peng \
            https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/FiveTechSoft/peng-mimo.git pm
          echo "jsonl disponibles en pm/dataset/verified:"
          ls pm/dataset/verified/ 2>/dev/null || echo "(ninguno aun)"

      - name: Cache corpus FineTome completo
        uses: actions/cache@v4
        with:
          path: adaptive/corpus_ft_big.bin
          key: finetome-100k-v1

      - name: Preparar corpus (peng-mimo hoy + FineTome-100k + historico)
        run: |
          cd adaptive
          # corpus nuevo: lo de hoy, normalizado a UTF-8
          cat ../pm/dataset/verified/prog-*.jsonl > batch.jsonl 2>/dev/null || true
          if [ -s batch.jsonl ]; then
            python3 -c "data = open('batch.jsonl','rb').read(); data = data.decode('utf-16').encode('utf-8') if data[:2] == b'\xff\xfe' else data; open('batch_u8.jsonl','wb').write(data); print('batch hoy:', len(data), 'bytes')"
            ./prep_data corpus_hoy.bin batch_u8.jsonl
          fi
          # FineTome-100k completo: descarga y convierte (cacheado, no commiteado)
          python3 -m pip install -q pyarrow || pip install -q pyarrow || true
          python3 ../../scripts/finetome_prep.py 2>/dev/null || python3 ../scripts/finetome_prep.py
          # open-perfectblend: segundo dataset mlabonne (shard rotante, cacheado)
          python3 ../../scripts/perfectblend_prep.py 2>/dev/null || python3 ../scripts/perfectblend_prep.py || true
          # mezcla: hoy + historico peng-mimo + FineTome + perfectblend
          cat corpus_peng.bin corpus_ft_small.bin > corpus_total.bin
          [ -f corpus_hoy.bin ] && cat corpus_hoy.bin >> corpus_total.bin
          [ -f corpus_ft_rot.bin ] && cat corpus_ft_rot.bin >> corpus_total.bin
          [ -f corpus_pb_rot.bin ] && cat corpus_pb_rot.bin >> corpus_total.bin
          echo "corpus_total: $(stat -c%s corpus_total.bin) bytes"; ls -la corpus_*.bin

      - name: Entrenar (gate de publicacion por PPL, union con checkpoint local)
        run: |
          cd adaptive
          echo "corpus:"; ls -la corpus_*.bin
          # convierte corpus_total.bin (bytes) a ids BPE -> corpus_cycle_ids.bin
          python3 -c "data = open('corpus_total.bin','rb').read(); import struct, sys; sys.path.insert(0,'../scripts'); import encode_corpora as ec; arr = ec.load_vocab(); ec.arr_by_id = dict(arr); encode_frag = ec.encode_frag; out=[]; frag=bytearray()
          for b in data:
              if b in (1,2,3):
                  if frag: out.extend(encode_frag(bytes(frag), arr)); frag = bytearray()
                  out.append(b)
              else: frag.append(b)
          if frag: out.extend(encode_frag(bytes(frag), arr))
          open('corpus_cycle_ids.bin','wb').write(struct.pack('<I', len(out)))
          open('corpus_cycle_ids.bin','ab').write(struct.pack(f'<{len(out)}I', *out))
          print('ids:', len(out))
          "
          # PUNTO DE PARTIDA: el mas avanzado entre model.adm (nube) y
          # checkpoint.chk (local, subido por watcher): comparo train_steps
          PUNTO="model.adm"
          if [ -f checkpoint.chk ] && [ ! -f model.adm ]; then
            PUNTO="checkpoint.chk"
          elif [ -f checkpoint.chk ] && [ -f model.adm ] && [ $(stat -c%s ../checkpoint.chk) -gt $(stat -c%s model.adm) ]; then
            PUNTO="checkpoint.chk"   # el chk mas grande => mas entrenado (heuristica)
          fi
          echo "punto de partida: $PUNTO"
          # entrena 3 tandas; checkpoint por tanda; CMA promedia al final
          for ciclo in 1 2 3; do
            ./train_gpu --model "$PUNTO" --data corpus_cycle_ids.bin \
              --val corpus_cycle_ids.bin --steps 3000 --batch 8 --ctx 96 \
              --eval 60 --out "tanda${ciclo}.adm" --vocab 2048 --gpu || \
            ./train_gpu --fresh 192,6,6 --vocab 2048 --data corpus_cycle_ids.bin \
              --val corpus_cycle_ids.bin --steps 3000 --batch 8 --ctx 96 --gpu || true
            PUNTO="tanda${ciclo}.adm"
          done
          # CMA (PuRo 3.4): promedia las 3 tandas -> model.adm, gate por PPL
          if [ -f tanda1.adm ] && [ -f tanda2.adm ] && [ -f tanda3.adm ]; then
            ./cma model_cma.adm tanda1.adm tanda2.adm tanda3.adm || true
            cp model_cma.adm model.adm 2>/dev/null || true
          else
            [ -f tanda3.adm ] && cp tanda3.adm model.adm || true
          fi
          true
          cat metrics.csv 2>/dev/null | tail -5

      - name: Commit modelo + metricas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add adaptive/model.adm adaptive/metrics.csv
          if git diff --cached --quiet; then
            echo "sin cambios que publicar"
          else
            git commit -m "adaptive: ciclo de entrenamiento automatico $(date -u +%Y-%m-%dT%H:%M)"
            # rebasa por si alguien (humano u otro run) pusheo mientras entrenaba
            git pull --rebase origin main || git rebase --abort || true
            git push || (git pull --rebase origin main && git push)
          fi

      - name: Re-deploy Pages con el modelo mejorado
        if: success()
        run: |
          # el deploy.yml corre on:push en main; el push del bot ya lo dispara.
          # fallback: dispatch manual por si main estaba a la par.
          gh workflow run deploy.yml --ref main || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
